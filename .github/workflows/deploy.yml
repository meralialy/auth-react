name: Deploy to Cloudflare Pages

run-name: ${{ github.event.head_commit.message }}

env:
    NODE_VERSION: 24
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    CLOUDFLARE_PROJECT_NAME: auth-react
    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main, develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    format:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Run format
              run: yarn format

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Run lint
              run: yarn lint

    build:
        name: Build
        needs: [format, lint]
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build app
              run: yarn build

            - name: Upload build artifact
              uses: actions/upload-artifact@v5
              with:
                  name: app-build
                  path: dist/
                  retention-days: 1

    deploy-staging:
        name: Staging Deploy
        needs: [build]
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/develop'
        permissions:
            contents: read
            deployments: write
        steps:
            - name: Download build artifact
              uses: actions/download-artifact@v5
              with:
                  name: app-build
                  path: ./dist-site

            - name: Publish to Cloudflare Pages
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy ./dist-site --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=develop

    deploy-production:
        name: Production Deploy
        needs: [build]
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: read
            deployments: write
        steps:
            - name: Download build artifact
              uses: actions/download-artifact@v5
              with:
                  name: app-build
                  path: ./dist-site

            - name: Publish to Cloudflare Pages
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy ./dist-site --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=main
